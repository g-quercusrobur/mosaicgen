<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02030a">
<title>cosmo weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500&family=Jost:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="bar top">
    <span class="mark">cosmo weather</span>
    <nav class="group">
      <button data-mode="clock">clock</button>
      <button data-mode="chart">chart</button>
    </nav>
    <nav class="group">
      <button id="info" title="readout (i)">readout</button>
      <button id="full" title="screen (f)">screen</button>
    </nav>
  </header>

  <main id="stage"><canvas id="dial" aria-label="the sky of the moment, as a dial"></canvas><div id="caption"></div></main>

  <aside id="readout" aria-live="polite"></aside>

  <footer class="bar bottom">
    <nav class="group time">
      <button data-step="-24">−1d</button>
      <button data-step="-1">−1h</button>
      <button id="live">now</button>
      <button data-step="1">+1h</button>
      <button data-step="24">+1d</button>
      <button id="play" title="one hour per second (space)">run</button>
      <input id="when" type="datetime-local" aria-label="moment">
    </nav>
    <nav class="group">
      <button data-place="greenwich">greenwich</button>
      <button data-place="rome">rome</button>
      <button data-place="jerusalem">jerusalem</button>
      <button data-place="here">here</button>
    </nav>
    <nav class="group">
      <button id="save">save 2048</button>
      <button id="save-hd">save 4096</button>
    </nav>
  </footer>

  <script src="js/vendor/astronomy.browser.min.js"></script>
  <script src="js/color.js"></script>
  <script src="js/correspondences.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/glyphs.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
