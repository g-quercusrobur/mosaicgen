}

/* the two arcs of the lens drawn separately, each run a little past the points, as a compass leaves them */

/* the compass tails: the two circles run on past the lens's points, each end a stroke of its own */

/* the heart of the star: the central heptagon with the seven small triangles about it, filled */

/* the innermost heptagon of the star, the seven crossings nearest the centre, filled: the sun sits on black */
function innerHeptagon(ctx, cx, cy, r) { const P = starPath(cx, cy, r), n = 7, E = i => [P[i], P[(i + 1) % n]]; const X = [];

  ctx.strokeStyle = GOLD; ctx.lineWidth = 1.8 * u; ctx.beginPath(); ctx.arc(cx, cy, 17 * u, 0, 7); ctx.stroke(); }

    lensPath(ctx, cx, cy, 196 * u); ctx.strokeStyle = GREEN; ctx.lineWidth = 2.2 * u; ctx.stroke();
